# docker-compose.yaml

services:
  # Database (PostgreSQL)
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: blog

    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - blog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d blog"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Backend (Spring Boot)
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://database:5432/blog
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

    networks:
      - blog-network

volumes:
  db_data:

networks:
  blog-network:
