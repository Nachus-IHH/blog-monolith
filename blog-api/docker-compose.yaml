# docker-compose.yaml

services:
  database:
    image: postgres:16-alpine
    container_name: blog-postgre-dev
    environment:
      - POSTGRES_USER=${DEV_USER_DB}
      - POSTGRES_PASSWORD=${DEV_PASSWORD_DB}
      - POSTGRES_DB=blog_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - blog-network

volumes:
  db_data:

networks:
  blog-network:

